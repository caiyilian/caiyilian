name: Generate Profile Assets

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
    - main

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      # Snake: miccy works (Platane/snk fails due to GraphQL limits)
      - uses: miccy/snake-evolution@v1
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: dist/github-snake.svg

      - uses: miccy/snake-evolution@v1
        with:
          github_user_name: ${{ github.repository_owner }}
          theme: github-dark
          outputs: dist/github-snake-dark.svg

      # Stats card via REST API
      - name: Generate stats SVGs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          USER=$(gh api users/caiyilian --jq '{login, public_repos, followers, following, created_at}')
          STARS=$(gh api users/caiyilian/repos?per_page=100 --jq '[.[].stargazers_count] | add // 0')
          COMMITS=$(gh api "search/commits?q=author:caiyilian&per_page=1" --jq '.total_count // 0' 2>/dev/null || echo "0")
          PRS=$(gh api "search/issues?q=author:caiyilian+type:pr&per_page=1" --jq '.total_count // 0' 2>/dev/null || echo "0")
          ISSUES=$(gh api "search/issues?q=author:caiyilian+type:issue&per_page=1" --jq '.total_count // 0' 2>/dev/null || echo "0")
          CONTRIBUTED=$(gh api users/caiyilian/repos?per_page=100 --jq '[.[].fork] | map(select(.)) | length' 2>/dev/null || echo "0")
          LOGIN=$(echo "" | jq -r '.login')
          STARS_VAL=$STARS; COMMITS_VAL=$COMMITS; PRS_VAL=$PRS; ISSUES_VAL=$ISSUES; CON_VAL=$CONTRIBUTED
          REPOS=$(echo "" | jq -r '.public_repos')
          FOLLOWERS=$(echo "" | jq -r '.followers')
          JOINED=$(echo "" | jq -r '.created_at | .[0:10]')
          DATE=$(date -u '+%B %d, %Y')
          if [ $STARS -gt 1000 ] || [ $COMMITS -gt 5000 ]; then RANK="A"
          elif [ $STARS -gt 500 ] || [ $COMMITS -gt 2000 ]; then RANK="A-"
          elif [ $STARS -gt 200 ] || [ $COMMITS -gt 1000 ]; then RANK="B+"
          elif [ $STARS -gt 50 ] || [ $COMMITS -gt 500 ]; then RANK="B"
          else RANK="B-"; fi
          mkdir -p dist
          cat > dist/github-stats-dark.svg << 'SVGEOF'
          <svg width="467" height="195" viewBox="0 0 467 195" role="img"><title>GitHub Overview, Rank: RANK_PLACEHOLDER</title>
          <desc>Stars: STARS_PLACEHOLDER Commits: COMMITS_PLACEHOLDER PRs: PRS_PLACEHOLDER Issues: ISSUES_PLACEHOLDER Contributed: CON_PLACEHOLDER</desc>
          <style>.h{font:600 18px 'Segoe UI',Ubuntu,sans-serif;fill:#58a6ff}.s{font:600 14px 'Segoe UI',Ubuntu,sans-serif;fill:#c9d1d9}.r{font:800 24px 'Segoe UI',Ubuntu,sans-serif;fill:#c9d1d9}.i{fill:#58a6ff}.c{stroke:#58a6ff;fill:none;stroke-width:6}</style>
          <rect x="0.5" y="0.5" width="466" height="194" rx="4.5" fill="#00000000"/>
          <g transform="translate(25,35)"><text class="h">GitHub Overview</text></g>
          <g transform="translate(0,55)">
            <g transform="translate(390.5,47.5)">
              <circle class="c" opacity="0.2" cx="-10" cy="8" r="40"/>
              <circle class="c" opacity="0.8" cx="-10" cy="8" r="40" stroke-dasharray="250" transform="rotate(-90,-10,8)"/>
              <text x="-5" y="3" class="r" text-anchor="middle" dominant-baseline="central">RANK_PLACEHOLDER</text>
            </g>
            <svg x="0" y="0">
              <g transform="translate(25,0)"><svg class="i" viewBox="0 0 16 16" width="16" height="16"><path d="M8 .25a.75.75 0 01.673.418l1.882 3.815 4.21.612a.75.75 0 01.416 1.279l-3.046 2.97.719 4.192a.75.75 0 01-1.088.791L8 12.347l-3.766 1.98a.75.75 0 01-1.088-.79l.72-4.194L.818 6.374a.75.75 0 01.416-1.28l4.21-.611L7.327.668A.75.75 0 018 .25z"/></svg><text x="25" y="12.5" class="s">Total Stars Earned:</text><text x="219" y="12.5" class="s">STARS_PLACEHOLDER</text></g>
              <g transform="translate(25,25)"><svg class="i" viewBox="0 0 16 16" width="16" height="16"><path d="M1.643 3.143L.427 1.927A.25.25 0 000 2.104V5.75c0 .138.112.25.25.25h3.646a.25.25 0 00.177-.427L2.715 4.215a6.5 6.5 0 11-1.18 4.458.75.75 0 10-1.493.154 8.001 8.001 0 101.6-5.684zM7.75 4a.75.75 0 01.75.75v2.992l2.028.812a.75.75 0 01-.557 1.392l-2.5-1A.75.75 0 017 8.25v-3.5A.75.75 0 017.75 4z"/></svg><text x="25" y="12.5" class="s">Total Commits:</text><text x="219" y="12.5" class="s">COMMITS_PLACEHOLDER</text></g>
              <g transform="translate(25,50)"><svg class="i" viewBox="0 0 16 16" width="16" height="16"><path d="M7.177 3.073L9.573.677A.25.25 0 0110 .854v4.792a.25.25 0 01-.427.177L7.177 3.427a.25.25 0 010-.354zM3.75 2.5a.75.75 0 100 1.5.75.75 0 000-1.5zm-2.25.75a2.25 2.25 0 113 2.122v5.256a2.251 2.251 0 11-1.5 0V5.372A2.25 2.25 0 011.5 3.25zM11 2.5h-1V4h1a1 1 0 011 1v5.628a2.251 2.251 0 101.5 0V5A2.5 2.5 0 0011 2.5zm1 10.25a.75.75 0 111.5 0 .75.75 0 01-1.5 0zM3.75 12a.75.75 0 100 1.5.75.75 0 000-1.5z"/></svg><text x="25" y="12.5" class="s">Total PRs:</text><text x="219" y="12.5" class="s">PRS_PLACEHOLDER</text></g>
              <g transform="translate(25,75)"><svg class="i" viewBox="0 0 16 16" width="16" height="16"><path d="M8 1.5a6.5 6.5 0 100 13 6.5 6.5 0 000-13zM0 8a8 8 0 1116 0A8 8 0 010 8zm9 3a1 1 0 11-2 0 1 1 0 012 0zm-.25-6.25a.75.75 0 00-1.5 0v3.5a.75.75 0 001.5 0v-3.5z"/></svg><text x="25" y="12.5" class="s">Total Issues:</text><text x="219" y="12.5" class="s">ISSUES_PLACEHOLDER</text></g>
              <g transform="translate(25,100)"><svg class="i" viewBox="0 0 16 16" width="16" height="16"><path d="M2 2.5A2.5 2.5 0 014.5 0h8.75a.75.75 0 01.75.75v12.5a.75.75 0 01-.75.75h-2.5a.75.75 0 110-1.5h1.75v-2h-8a1 1 0 00-.714 1.7.75.75 0 01-1.072 1.05A2.495 2.495 0 012 11.5v-9zm10.5-1V9h-8c-.356 0-.694.074-1 .208V2.5a1 1 0 011-1h8zM5 12.25v3.25a.25.25 0 00.4.2l1.45-1.087a.25.25 0 01.3 0L8.6 15.7a.25.25 0 00.4-.2v-3.25a.25.25 0 00-.25-.25h-3.5a.25.25 0 00-.25.25z"/></svg><text x="25" y="12.5" class="s">Contributed to (last year):</text><text x="219" y="12.5" class="s">CON_PLACEHOLDER</text></g>
            </svg>
          </g></svg>
          SVGEOF
          sed -i "s/RANK_PLACEHOLDER/\/g; s/STARS_PLACEHOLDER/\/g; s/COMMITS_PLACEHOLDER/\/g; s/PRS_PLACEHOLDER/\/g; s/ISSUES_PLACEHOLDER/\/g; s/CON_PLACEHOLDER/\/g" dist/github-stats-dark.svg
          cp dist/github-stats-dark.svg dist/github-stats-light.svg
          sed -i 's/#58a6ff/#0969da/g; s/#c9d1d9/#1f2328/g' dist/github-stats-light.svg
          echo "Done:"; ls -la dist/

      - name: Deploy to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          keep_history: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}