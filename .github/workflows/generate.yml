name: Generate Profile Assets

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
    - main

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: miccy/snake-evolution@v1
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: dist/github-snake.svg

      - name: Stats
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          S=$(gh api users/caiyilian/repos?per_page=100 --jq '[.[].stargazers_count] | add // 0')
          C=$(gh api search/commits?q=author:caiyilian\&per_page=1 --jq '.total_count // 0' 2>/dev/null || echo "0")
          P=$(gh api search/issues?q=author:caiyilian+type:pr\&per_page=1 --jq '.total_count // 0' 2>/dev/null || echo "0")
          I=$(gh api search/issues?q=author:caiyilian+type:issue\&per_page=1 --jq '.total_count // 0' 2>/dev/null || echo "0")
          echo "{""stars"":$S,""commits"":$C,""prs"":$P,""issues"":$I}" > dist/data.json
          ls -la dist/

      - name: Deploy
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          keep_history: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}