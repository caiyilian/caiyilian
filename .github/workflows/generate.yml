name: Generate Profile Assets

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
    - main

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: miccy/snake-evolution@v1
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: dist/github-snake.svg

      - name: Generate stats SVG
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          STARS=$(gh api repos/caiyilian/caiyilian --jq '.stargazers_count' 2>/dev/null || echo "0")
          USER=$(gh api users/caiyilian --jq '{public_repos}')
          REPOS=$(echo "$USER" | jq -r '.public_repos')
          cat > dist/github-stats-dark.svg << 'EOF'
          <svg width="467" height="195" viewBox="0 0 467 195" role="img">
            <title>GitHub Stats</title>
            <rect x="0.5" y="0.5" width="466" height="194" rx="4.5" fill="#00000000"/>
            <text x="25" y="35" font-family="sans-serif" font-size="18" font-weight="600" fill="#58a6ff">GitHub Overview</text>
            <text x="25" y="75" font-family="sans-serif" font-size="14" fill="#c9d1d9">Stars: S</text>
            <text x="25" y="100" font-family="sans-serif" font-size="14" fill="#c9d1d9">Repos: R</text>
          </svg>
EOF
          sed -i "s/S/$STARS/g; s/R/$REPOS/g" dist/github-stats-dark.svg
          cp dist/github-stats-dark.svg dist/github-stats-light.svg
          sed -i 's/#58a6ff/#0969da/g; s/#c9d1d9/#1f2328/g' dist/github-stats-light.svg
          echo "Done"; ls -la dist/

      - name: Deploy
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          keep_history: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}