name: Generate Profile Assets

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/generate.yml"
      - ".github/scripts/stats_card.py"
      - ".github/scripts/activity_graph.py"

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: miccy/snake-evolution@v1
        with:
          github_user_name: ${{ github.repository_owner }}
          theme: github-dark
          outputs: dist/github-snake-dark.svg

      - uses: miccy/snake-evolution@v1
        with:
          github_user_name: ${{ github.repository_owner }}
          theme: github-light
          outputs: dist/github-snake.svg

      - name: Generate stats card
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/stats_card.py

      - name: Generate activity graph
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/activity_graph.py

      - name: Deploy
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          keep_history: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}