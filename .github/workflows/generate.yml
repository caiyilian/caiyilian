name: Generate Profile Assets

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
    - main

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: miccy/snake-evolution@v1
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: dist/github-snake.svg

      - name: Make stats SVG
        run: |
          mkdir -p dist
          echo '<svg width="467" height="195" viewBox="0 0 467 195" xmlns="http://www.w3.org/2000/svg">
          <rect x="0.5" y="0.5" width="466" height="194" rx="4.5" fill="#00000000"/>
          <text x="25" y="35" font-family="sans-serif" font-size="18" font-weight="600" fill="#58a6ff">GitHub Overview</text>
          <text x="25" y="75" font-family="sans-serif" font-size="14" fill="#c9d1d9">caiyilian</text>
          </svg>' > dist/github-stats-dark.svg
          cp dist/github-stats-dark.svg dist/github-stats-light.svg
          ls -la dist/

      - name: Deploy
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          keep_history: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}