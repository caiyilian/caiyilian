name: Generate Profile Assets

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: miccy/snake-evolution@v1
        with:
          github_user_name: ${{ github.repository_owner }}
          theme: github-dark
          outputs: dist/github-snake-dark.svg

      - uses: miccy/snake-evolution@v1
        with:
          github_user_name: ${{ github.repository_owner }}
          theme: github-light
          outputs: dist/github-snake.svg

      - name: Fetch stats
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          S=$(gh api /users/caiyilian/repos --jq '[.[].stargazers_count] | add // 0')
          R=$(gh api /users/caiyilian --jq '.public_repos')
          echo '<svg width="467" height="195" viewBox="0 0 467 195" xmlns="http://www.w3.org/2000/svg">
          <style>.h{font:600 18px sans-serif;fill:#58a6ff}.s{font:600 14px sans-serif;fill:#c9d1d9}.r{font:800 24px sans-serif;fill:#c9d1d9}.c{stroke:#58a6ff;fill:none;stroke-width:6}</style>
          <rect x="0.5" y="0.5" width="466" height="194" rx="4.5" fill="#00000000"/>
          <g transform="translate(25,35)"><text class="h">GitHub Overview</text></g>
          <g transform="translate(0,55)">
            <g transform="translate(390.5,47.5)">
              <circle class="c" opacity="0.2" cx="0" cy="0" r="40"/>
              <circle class="c" opacity="0.8" cx="0" cy="0" r="40" stroke-dasharray="250" transform="rotate(-90)"/>
              <text x="0" y="0" class="r" text-anchor="middle" dominant-baseline="central">B+</text>
            </g>
            <g transform="translate(25,0)"><text x="0" y="12.5" class="s">Total Stars Earned:</text><text x="219" y="12.5" class="s">'$S'</text></g>
            <g transform="translate(25,25)"><text x="0" y="12.5" class="s">Total Commits:</text><text x="219" y="12.5" class="s">1,541</text></g>
            <g transform="translate(25,50)"><text x="0" y="12.5" class="s">Total PRs:</text><text x="219" y="12.5" class="s">594</text></g>
            <g transform="translate(25,75)"><text x="0" y="12.5" class="s">Total Issues:</text><text x="219" y="12.5" class="s">637</text></g>
            <g transform="translate(25,100)"><text x="0" y="12.5" class="s">Repositories:</text><text x="219" y="12.5" class="s">'$R'</text></g>
          </g></svg>' > dist/github-stats-dark.svg
          cp dist/github-stats-dark.svg dist/github-stats-light.svg
          sed -i 's/#58a6ff/#0969da/g; s/#c9d1d9/#1f2328/g' dist/github-stats-light.svg
          ls -la dist/

      - name: Deploy
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          keep_history: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}